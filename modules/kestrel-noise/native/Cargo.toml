[package]
name = "kestrel_noise"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
jni = "0.21.1"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snow = { version = "0.9.6", default-features = true }
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
